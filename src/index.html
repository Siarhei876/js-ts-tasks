<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Task</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./iphone.js"></script>
  </head>
  <body>
    <iphone-frame>
      <div class="main">
        <div class="top-bar">
          <button class="top-bar__arrow">
            <svg width="12" height="22" viewBox="0 0 12 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.6934 1.61633L1.52002 10.7897L10.6934 19.963" stroke="white" stroke-width="2.29333" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <p>user_name</p>
          <button class="top-bar__three-dots">
            <svg width="18" height="4" viewBox="0 0 18 4" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="2.17276" cy="1.7897" r="1.72" fill="white"/>
              <circle cx="9.05203" cy="1.78976" r="1.72" fill="white"/>
              <circle cx="15.9335" cy="1.78976" r="1.72" fill="white"/>
            </svg>
          </button>
        </div>
        <div class="user-info">
          <div class="user-info__top">
            <img src="./content/misc/Avatar.svg">
            <div class="user-info__top__stats">
              <div class="user-info__stats__posts">
                <p>88</p>
                <h6>Posts</h6>
              </div>
              <div class="user-info__stats__followers">
                <p>9000</p>
                <h6>Followers</h6>
              </div>
              <div>
                <p>8</p>
                <h6>Following</h6>
              </div>
            </div>
          </div>
          <div class="user-info__bottom">
            <div class="user-info__bottom__user">
              <p>userName</p>
              <p>localBusiness</p>
              <p>www.website.eu</p>
            </div>
          </div>
        </div>
        <div class="action-buttons" >
          <button class="action-buttons__follow">Follow</button>
          <button class="action-buttons__message">Message</button>
          <button class="action-buttons__email">Email</button>
          <button class="action-buttons__arrow">
            <svg width="11" height="8" viewBox="0 0 11 8" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.29407 1.97339L5.3074 5.98672L9.32073 1.97339" stroke="white" stroke-width="2.29333" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="highlight-buttons">
          <button class="highlight-button"><img src="./content/misc/Instagram highlight icons.svg"><p>Highlight</p></button>
          <button class="highlight-button"><img src="./content/misc/Instagram highlight icons(1).svg"><p>Highlight</p></button>
          <button class="highlight-button"><img src="./content/misc/Instagram highlight icons(2).svg"><p>Highlight</p></button>
          <button class="highlight-button"><img src="./content/misc/Instagram highlight icons(3).svg"><p>Highlight</p></button>
        </div>
        <div class="gallery">
          <div class="gallery-buttons">
            <div id="gallery-buttons__wrapper"><button class="gallery-buttons__photos"><img src="./content/misc/photos.svg"></button></div>
            <div id="gallery-buttons__wrapper"><button class="gallery-buttons__tags"><img src="./content/misc/tags.svg"></button></div>
          </div>
          <div class="gallery__pictures">

          </div>
      </div>
      <div class="bottom-bar">
        <button class="bottom-bar__home-button"><img src="./content/misc/Home.svg"></button>
        <button class="bottom-bar__search-button"><img src="./content/misc/Search.svg"></button>
        <button class="bottom-bar__add-button"><img src="./content/misc/Add.svg"></button>
        <button class="bottom-bar__like-button"><img src="./content/misc/Like.svg"></button>
        <button class="bottom-bar__frame-button"><img src="./content/misc/Frame.svg"></button>       
      </div>  

      <script src="./content/gallery/galeryIndex.js"></script>
      
    </iphone-frame>
  </body>
</html>
